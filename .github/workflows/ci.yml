name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ZIG_VERSION: 0.17.0
      # Pinned dep commits (both declare minimum_zig_version 0.17.0).
      ZIG_CURL_REF: 9c0f1d211ad22dd0f4c20aa54060c1d9f163595a
      HTTPX_REF: deacfacea9a83c060d65ad65da1e40fa2edadc43

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build.zig.zon links zig-curl and httpx via local paths (../zig-curl and
      # ../httpx.zig), so check both out as siblings of the project checkout,
      # pinned to the commits that build under Zig 0.17.
      - name: Checkout zig-curl dependency
        uses: actions/checkout@v4
        with:
          repository: jiacai2050/zig-curl
          ref: ${{ env.ZIG_CURL_REF }}
          path: ../zig-curl

      - name: Checkout httpx dependency
        uses: actions/checkout@v4
        with:
          repository: muhammad-fiaz/httpx.zig
          ref: ${{ env.HTTPX_REF }}
          path: ../httpx.zig

      # The build links against the system libcurl (link_vendor = false).
      - name: Install libcurl
        run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev

      # The deps require Zig 0.17 (minimum_zig_version 0.17.0). Cache the toolchain
      # so it is not re-downloaded each run.
      - name: Cache Zig toolchain
        id: zig-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/zig-0.17
          key: zig-${{ env.ZIG_VERSION }}-x86_64-linux

      - name: Install Zig 0.17
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSL -o zig.tar.xz "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          tar xf zig.tar.xz
          mv "zig-x86_64-linux-${ZIG_VERSION}" zig-0.17

      - name: Pin ZIG_17
        run: echo "ZIG_17=${RUNNER_TEMP}/zig-0.17/zig" >> "$GITHUB_ENV"

      # Warm build cache (per-commit key, falling back to the latest one for this
      # Zig version) so the compile usually finishes well under the timeout.
      - name: Cache Zig build cache
        uses: actions/cache@v4
        with:
          path: .zig-cache
          key: zigbuild-${{ env.ZIG_VERSION }}-${{ github.sha }}
          restore-keys: |
            zigbuild-${{ env.ZIG_VERSION }}-

      - name: Build
        run: ./zig build

      - name: Test
        run: ./zig build test
