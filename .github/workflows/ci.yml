name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs: a new push to the same branch cancels the in-flight
# one, so we stop burning runner time on commits that are already stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    # The cold run (toolchain download + apt + full build + test) can approach
    # 5 min under runner load; leave headroom so a slow network isn't a red X.
    timeout-minutes: 10
    env:
      ZIG_VERSION: 0.17.0
      # Pinned dep commits (both declare minimum_zig_version 0.17.0).
      ZIG_CURL_REF: 9c0f1d211ad22dd0f4c20aa54060c1d9f163595a
      HTTPX_REF: deacfacea9a83c060d65ad65da1e40fa2edadc43
      # Run the (Node 20) checkout/cache actions on Node 24 to silence the
      # runner deprecation warnings.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # build.zig.zon links zig-curl and httpx via local paths (../zig-curl and
      # ../httpx.zig), so both must exist as siblings of the project checkout,
      # pinned to the commits that build under Zig 0.17.
      #
      # actions/checkout@v4 refuses to write outside GITHUB_WORKSPACE, so each
      # dep is checked out into ./deps/ first, then moved to its sibling slot.
      - name: Checkout zig-curl dependency
        uses: actions/checkout@v4
        with:
          repository: jiacai2050/zig-curl
          ref: ${{ env.ZIG_CURL_REF }}
          path: deps/zig-curl

      - name: Checkout httpx dependency
        uses: actions/checkout@v4
        with:
          repository: muhammad-fiaz/httpx.zig
          ref: ${{ env.HTTPX_REF }}
          path: deps/httpx.zig

      - name: Move dependencies to sibling locations
        run: |
          set -euo pipefail
          deps_root="$(dirname "$GITHUB_WORKSPACE")"
          mv "$GITHUB_WORKSPACE/deps/zig-curl" "$deps_root/zig-curl"
          mv "$GITHUB_WORKSPACE/deps/httpx.zig" "$deps_root/httpx.zig"

      # The build links against the system libcurl (link_vendor = false).
      - name: Install libcurl
        run: sudo apt-get install -y libcurl4-openssl-dev

      # The deps require Zig 0.17. setup-zig resolves the version from
      # build.zig.zon's minimum_zig_version, downloads the toolchain (via
      # community mirrors) and verifies its minisign signature, then puts `zig`
      # on PATH. The project-local ./zig wrapper prefers a 0.17 `zig` on PATH,
      # so no ZIG_17 pin is needed. It also caches the global Zig cache and
      # redirects local caches into it, so the std lib isn't rebuilt each run.
      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      # URL deps (zstd, brotli, env, ...) are extracted into zig-pkg/. Keyed on
      # the .zon so a dep bump refetches; otherwise the ~87MB isn't re-downloaded.
      - name: Cache Zig package cache
        uses: actions/cache@v4
        with:
          path: zig-pkg
          key: zigpkg-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig.zon') }}
          save-always: true

      - name: Build
        run: ./zig build

      - name: Test
        run: ./zig build test
